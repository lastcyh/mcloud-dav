name: clean-and-upload

on:
  schedule:
    - cron: "20 2 * * *" # UTC 2:20 = 北京 10:20, 每天清洗并推送 catalog
  workflow_dispatch: {} # 手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 清洗 data/ 下的链接文档
        run: python clean_links.py

      # data/ 里没有有效链接时 clean_links.py 不会生成 catalog.json，
      # 这里跳过上传，避免拿空目录 / 示例数据覆盖线上真实目录
      - name: 上传 catalog 到 Worker
        if: ${{ hashFiles('catalog.json') != '' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DAV_USER: ${{ secrets.DAV_USER }}
          DAV_PASS: ${{ secrets.DAV_PASS }}
        run: python upload_catalog.py --url "$WORKER_URL" --user "$DAV_USER" --pass "$DAV_PASS"

      - name: 提示
        if: ${{ hashFiles('catalog.json') == '' }}
        run: echo "::warning::data/ 里没有有效分享链接，已跳过上传（线上目录未改动）。要批量导入请把链接文档放进 data/"
